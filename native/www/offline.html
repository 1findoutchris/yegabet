<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>VinnaBet</title>
  <style>
    :root { color-scheme: dark; }
    html, body { margin: 0; height: 100%; background: #0A1222; color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    main { min-height: 100%; display: flex; flex-direction: column; align-items: center;
      justify-content: center; gap: 14px; padding: 24px; box-sizing: border-box; text-align: center; }
    svg { width: 72px; height: 72px; }
    h1 { margin: 8px 0 0; font-size: 20px; }
    p { margin: 0; max-width: 300px; font-size: 14px; line-height: 1.5; color: #9AA8C2; }
    button { margin-top: 10px; border: 0; border-radius: 14px; padding: 14px 28px; font-size: 15px;
      font-weight: 700; color: #04121A; background: #19D3C5; }
    button:disabled { opacity: .6; }
    small { color: #5D6B85; font-size: 12px; }
  </style>
</head>
<body>
  <main>
    <svg viewBox="0 0 512 512" aria-hidden="true">
      <rect width="512" height="512" rx="116" fill="#0F1A2E"/>
      <path d="M132 132 L226 132 L256 296 L286 132 L380 132 L296 380 L216 380 Z" fill="#19D3C5"/>
    </svg>
    <h1 id="title">You're offline</h1>
    <p id="text">VinnaBet needs an internet connection. Your balance and bets are safe; check your connection and try again.</p>
    <button id="retry">Try again</button>
    <small id="status"></small>
  </main>
  <script>
    // Must match server.url in capacitor.config.ts.
    var APP_URL = "https://vinna.bet/casino";
    var btn = document.getElementById("retry");
    var status = document.getElementById("status");

    // Android also lands here when a page answers with an HTTP error, so only
    // say "offline" when the phone really is.
    if (navigator.onLine) {
      document.getElementById("title").textContent = "Couldn't load VinnaBet";
      document.getElementById("text").textContent =
        "Something went wrong opening this page. Your balance and bets are safe; try again.";
    }

    function retry() {
      btn.disabled = true;
      status.textContent = "Connecting…";
      // A no-cors probe resolves on any response and rejects only when the
      // network is down, so the app never lands on a browser error page.
      fetch(APP_URL, { mode: "no-cors", cache: "no-store" })
        .then(function () { location.replace(APP_URL); })
        .catch(function () {
          btn.disabled = false;
          status.textContent = "Still no connection.";
        });
    }

    btn.addEventListener("click", retry);
    window.addEventListener("online", retry);
  </script>
</body>
</html>
