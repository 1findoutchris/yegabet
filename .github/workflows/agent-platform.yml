name: Agent platform CI

# The agent platform API (agent-platform/) is its own Node project with its own
# package.json and database; this runs only when it changes.
on:
  push:
    paths: ["agent-platform/**", ".github/workflows/agent-platform.yml"]
  pull_request:
    paths: ["agent-platform/**", ".github/workflows/agent-platform.yml"]

jobs:
  test:
    name: lint · typecheck · tests (real Postgres)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent-platform
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: agent_platform_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/agent_platform_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: agent-platform/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      # Unit + DB + concurrency + property tests, with the 100% ledger coverage gate.
      - run: npm run test:cov
      - run: npm run build
